function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function assignTeamsToPools(teams, poolSizes) {
  const shuffled = shuffleArray(teams);
  const pools = [];
  let index = 0;
  for (const size of poolSizes) {
    pools.push(shuffled.slice(index, index + size));
    index += size;
  }
  return pools;
}
function generateRoundRobinMatches(teams) {
  const matches = [];
  for (let i = 0; i < teams.length; i++) {
    for (let j = i + 1; j < teams.length; j++) {
      matches.push([teams[i], teams[j]]);
    }
  }
  return matches;
}
async function getTeamsByDivision(division) {
  const q = query(collection(db, "teams"), where("division", "==", division));
  const snapshot = await getDocs(q);
  return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
}
async function savePoolsToFirestore(division, pools) {
  const poolsData = pools.map((pool, i) => ({
    poolName: String.fromCharCode(65 + i),
    teams: pool.map(t => t.teamName)
  }));
  await setDoc(doc(db, "pools", division), { pools: poolsData });
}

async function saveMatchesToFirestore(division, pools) {
  // Remove any previously saved matches for this division
  const q = query(collection(db, "matches"), where("division", "==", division));
  const existingMatches = await getDocs(q);
  for (const docSnap of existingMatches.docs) {
    await deleteDoc(docSnap.ref);
  }

  // Create a new match document for every matchup in every pool
  for (let i = 0; i < pools.length; i++) {
    const poolLetter = String.fromCharCode(65 + i);
    const matches = generateRoundRobinMatches(pools[i]);
    for (const [teamA, teamB] of matches) {
      const matchId = `${division}_${poolLetter}_${teamA.teamName}_vs_${teamB.teamName}`
        .replace(/[^a-zA-Z0-9]/g, "_");
      await setDoc(doc(db, "matches", matchId), {
        division: division,
        poolName: poolLetter,
        teamA: teamA.teamName,
        teamB: teamB.teamName,
        scoreA: null,
        scoreB: null,
        completed: false
      });
    }
  }
}

async function saveMatchScore(division, poolName, teamA, teamB, scoreA, scoreB) {
  const q = query(
    collection(db, "matches"),
    where("division", "==", division),
    where("poolName", "==", poolName),
    where("teamA", "==", teamA),
    where("teamB", "==", teamB)
  );
  const snapshot = await getDocs(q);
  if (!snapshot.empty) {
    const matchDoc = snapshot.docs[0];
    await updateDoc(matchDoc.ref, { scoreA, scoreB, completed: true });
  }
}

async function calculateStandings(division, poolLetter, teamNames) {
  const q = query(
    collection(db, "matches"),
    where("division", "==", division),
    where("poolName", "==", poolLetter)
  );
  const snapshot = await getDocs(q);
  const matches = snapshot.docs.map(d => d.data());

  const stats = {};
  teamNames.forEach(name => {
    stats[name] = { team: name, wins: 0, losses: 0, pointsFor: 0, pointsAgainst: 0, diff: 0 };
  });

  matches.forEach(m => {
    if (!m.completed) return;
    stats[m.teamA].pointsFor += m.scoreA;
    stats[m.teamA].pointsAgainst += m.scoreB;
    stats[m.teamB].pointsFor += m.scoreB;
    stats[m.teamB].pointsAgainst += m.scoreA;
    if (m.scoreA > m.scoreB) { stats[m.teamA].wins++; stats[m.teamB].losses++; }
    else if (m.scoreB > m.scoreA) { stats[m.teamB].wins++; stats[m.teamA].losses++; }
  });

  Object.values(stats).forEach(s => s.diff = s.pointsFor - s.pointsAgainst);

  return Object.values(stats).sort((a, b) => {
    if (b.wins !== a.wins) return b.wins - a.wins;
    if (b.diff !== a.diff) return b.diff - a.diff;
    const headToHead = matches.find(m =>
      (m.teamA === a.team && m.teamB === b.team) || (m.teamA === b.team && m.teamB === a.team)
    );
    if (headToHead && headToHead.completed) {
      const aScore = headToHead.teamA === a.team ? headToHead.scoreA : headToHead.scoreB;
      const bScore = headToHead.teamA === b.team ? headToHead.scoreA : headToHead.scoreB;
      return bScore - aScore;
    }
    return 0;
  });
}

async function getAdvancingTeams(division, poolsOfNames) {
  const results = [];
  for (let i = 0; i < poolsOfNames.length; i++) {
    const poolLetter = String.fromCharCode(65 + i);
    const standings = await calculateStandings(division, poolLetter, poolsOfNames[i]);
    results.push({
      pool: poolLetter,
      first: standings[0] ? standings[0].team : "-",
      second: standings[1] ? standings[1].team : "-"
    });
  }
  return results;
}

async function getMatchScores(division) {
  const q = query(collection(db, "matches"), where("division", "==", division));
  const snapshot = await getDocs(q);
  const scores = {};
  snapshot.docs.forEach(d => {
    const data = d.data();
    scores[d.id] = { scoreA: data.scoreA || 0, scoreB: data.scoreB || 0, completed: data.completed || false };
  });
  return scores;
}

async function exportResultsToCSV(division, poolsOfNames) {
  let csvContent = "Pool,Team,Wins,Losses,Diff\n";
  for (let i = 0; i < poolsOfNames.length; i++) {
    const poolLetter = String.fromCharCode(65 + i);
    const standings = await calculateStandings(division, poolLetter, poolsOfNames[i]);
    standings.forEach(s => {
      csvContent += `${poolLetter},${s.team},${s.wins},${s.losses},${s.diff}\n`;
    });
  }
  const blob = new Blob([csvContent], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = `${division}-results.csv`;
  link.click();
  URL.revokeObjectURL(url);
}

async function printResults(division, poolsOfNames) {
  let printContent = `<h2>${division} Results</h2>`;
  for (let i = 0; i < poolsOfNames.length; i++) {
    const poolLetter = String.fromCharCode(65 + i);
    const standings = await calculateStandings(division, poolLetter, poolsOfNames[i]);
    printContent += `<h3>Pool ${poolLetter}</h3>`;
    printContent += `<table border="1" cellpadding="5"><tr><th>Team</th><th>Wins</th><th>Losses</th><th>Diff</th></tr>`;
    standings.forEach(s => {
      printContent += `<tr><td>${s.team}</td><td>${s.wins}</td><td>${s.losses}</td><td>${s.diff}</td></tr>`;
    });
    printContent += `</table>`;
  }
  const printWindow = window.open('', '_blank');
  printWindow.document.write(`<html><head><title>${division} Results</title></head><body>${printContent}</body></html>`);
  printWindow.document.close();
  printWindow.print();
}

      function calculatePools(totalTeams, minGames) {
        const minPoolSize = minGames + 1;

        let numPools = Math.floor(totalTeams / minPoolSize);
        if (numPools < 1) numPools = 1;

        const basePoolSize = Math.floor(totalTeams / numPools);
        const extraTeams = totalTeams % numPools;

        const pools = [];
        for (let i = 0; i < numPools; i++) {
          const size = i < extraTeams ? basePoolSize + 1 : basePoolSize;
          pools.push(size);
        }

        return pools;
      }
